# 1. Next.js Frontend UI (app.test)
server {
    listen 80;
    server_name app.test;

    location / {
        proxy_pass http://frontend-ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Laravel API Backend (api.app.test)
server {
    listen 80;
    server_name api.app.test;
    root /var/www/html/backend/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass local_laravel:9000; # Points to Laravel's internal PHP-FPM container port
        fastcgi_index index.php;
        include fastcgi_params;
        # The code lives at /var/www/html INSIDE the PHP-FPM containers,
        # so the SCRIPT_FILENAME path differs from nginx's own document root.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }
}

# 3. Headless WordPress CMS (cms.app.test)
server {
    listen 80;
    server_name cms.app.test;
    root /var/www/html/cms;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass local_wordpress:9000; # Points to WordPress's internal PHP-FPM container port
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
    }
}
