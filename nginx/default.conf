# 1. Next.js Frontend UI (app.test)
server {
    listen 80;
    server_name app.test;

    location / {
        proxy_pass http://frontend-ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Laravel API Backend (api.app.test)
server {
    listen 80;
    server_name api.app.test;
    root /var/www/html/backend/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        fastcgi_pass backend-api:9000; # Points to Laravel's internal PHP-FPM container port
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# 3. Headless WordPress CMS (cms.app.test)
server {
    listen 80;
    server_name cms.app.test;
    root /var/www/html/cms;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass cms-content:9000; # Points to WordPress's internal PHP-FPM container port
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
